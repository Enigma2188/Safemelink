plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tiziano.safemelink.safety'
version = '1.0.0'

dependencies {
  // Aligned with the app by the React Native Gradle Plugin.
  implementation 'com.facebook.react:react-android'
}

android {
  namespace 'com.tiziano.safemelink.safety'
  buildFeatures { buildConfig true }
  defaultConfig {
    // No debug/release inference: only the manual test workflow opts in.
    buildConfigField 'boolean', 'CHECKPOINT_DIAGNOSTICS', System.getenv('EXPO_PUBLIC_CHECKPOINT_DIAGNOSTICS') == 'true' ? 'true' : 'false'
    versionCode 1
    versionName '1.0.0'
  }
}
